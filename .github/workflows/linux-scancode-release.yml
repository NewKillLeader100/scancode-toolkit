name: Create ScanCode release archives (Linux only), then test and publish to GH and PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:

  build_scancode_wheel_for_pypi:
    permissions:
      contents: read
    name: Build PyPI wheels
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        pyver: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python  $ {{ matrix.pyver }}
        uses: actions/setup-python@v5
        with:
          python-version:  $ {{ matrix.pyver }}
      - name: Install requirements then build main and mini wheel
        run: etc/release/scancode-create-pypi-wheel.sh
      - name: Collect built wheels for  $ {{ matrix.pyver }}
        uses: actions/upload-artifact@v4
        with:
          name: wheels- $ {{ matrix.pyver }}
          path: dist/*.whl


  build_scancode_sdist_for_pypi:
    permissions:
      contents: read
    name: Build PyPI sdist archives
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install requirements then build main and mini sdist
        run: etc/release/scancode-create-pypi-sdist.sh
      - name: Collect built sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdists
          path: dist/*.tar.gz


  build_scancode_for_release_linux:
    permissions:
      contents: read
    name: Build app Release for linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        pyver: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --prune --unshallow
      - name: Set up Python  $ {{ matrix.pyver }}
        uses: actions/setup-python@v5
        with:
          python-version:  $ {{ matrix.pyver }}
      - name: Build linux app archive
        run: etc/release/scancode-create-release-app-linux.sh  $ {{ matrix.pyver }}
      - name: Collect built linux app for python  $ {{ matrix.pyver }}
        uses: actions/upload-artifact@v4
        with:
          name: linux_app_py_ $ {{ matrix.pyver }}
          path: release/*


  build_scancode_for_release_source:
    permissions:
      contents: read
    name: Build app source
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --prune --unshallow
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build source archive with deps
        run: etc/release/scancode-create-release-app-sources.sh
      - name: Collect built source app tarball
        uses: actions/upload-artifact@v4
        with:
          name: source_app
          path: release/*


  smoke_test_install_and_run_pypi_wheels_on_linux:
    permissions:
      contents: read
    name: Test PyPI wheels on Linux
    needs: [build_scancode_wheel_for_pypi]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        pyver: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python  $ {{ matrix.pyver }}
        uses: actions/setup-python@v5
        with:
          python-version:  $ {{ matrix.pyver }}
      - name: Download wheels artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels- $ {{ matrix.pyver }}
          path: dist
      - name: Test install and run
        run: |
          echo "license: gpl-2.0" > some.file
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip wheel setuptools
          for f in dist/* $ {{ matrix.pyver }}*.whl; do
            venv/bin/python -m pip install --force-reinstall " $ f[full]"
            venv/bin/scancode -clipeu --json-pp - some.file
          done


  smoke_test_install_and_run_app_archives_on_linux:
    permissions:
      contents: read
    name: Test Linux app archives
    needs: [build_scancode_for_release_linux]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        pyver: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python  $ {{ matrix.pyver }}
        uses: actions/setup-python@v5
        with:
          python-version:  $ {{ matrix.pyver }}
      - name: Download Linux app artifact
        uses: actions/download-artifact@v4
        with:
          name: linux_app_py_ $ {{ matrix.pyver }}
          path: dist
      - name: Test app archive
        run: |
          for f in dist/*.tar.gz dist/*.zip; do
            if [ -f " $ f" ]; then
              python etc/release/scancode_release_tests.py " $ f"
            fi
          done


  publish_to_gh_release:
    permissions:
      contents: write
    name: Publish to GH Release (Linux only)
    needs:
      - smoke_test_install_and_run_app_archives_on_linux
      - build_scancode_for_release_source
      - build_scancode_for_release_linux
    runs-on: ubuntu-24.04
    defaults:
